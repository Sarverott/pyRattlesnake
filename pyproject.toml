[project]
name = "pyrattlesnake"
version = "2.0.0"
description = "Admin's beloved pet in every shell system to be more like in home."
readme = "README.md"
authors = [
    { name = "Sett Sarverott A.A.B.", email = "sarverott@gmail.com" }
]
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "colorama>=0.4.6",
    "fastapi>=0.124.0",
    "gitpython>=3.1.45",
    "go-task-bin>=3.45.5",
    "notebook>=7.3.3",
    "numpy>=1.24.4",
    "ollama>=0.6.1",
    "opentimestamps>=0.4.5",
    "pandas>=2.0.3",
    "paramiko>=3.5.1",
    "podman>=5.2.0",
    "poetry>=1.8.5",
    "prompt-toolkit>=3.0.52",
    "pydrive>=1.3.1",
    "pygithub>=2.8.1",
    "pyyaml>=6.0.3",
    "qrcode>=7.4.2",
    "requests>=2.32.4",
    "rich>=14.2.0",
    "scapy>=2.6.1",
]
keywords = [ "packaging", "poetry" ]


classifiers = [
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules"
]


[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
